vr_to_arm_tf:
  #tf link mapping
  gripper_frame_link: wrist_right
gripper_world_frame: base_link
vr_world_frame: world_vr

# IK solver tolerances configuration
ik_tolerances:
  position_tolerance: 0.01    # Position tolerance in meters
  orientation_tolerance: 0.2  # Orientation tolerance in radians

trigger_config:
# 1 trigger position = 0.0068 radians
  trigger_to_gripper_scale: 0.0068  # Scale factor for trigger input to gripper position
  joint_mappings:
    # {joint name: vr topic}
    gripper: /vr/controller_right/joy

joint_pose:
  home_pose:
    joint_name: 
      - wrist_roll
      - shoulder_pan
      - shoulder_lift
      - gripper
      - wrist_flex
      - elbow_flex
    position:
      - 0.00153400113516084
      - 0.00613600454064336
      - -1.5370691374311618
      - 0.015340011351608401
      - 0.9541487060700425
      - 1.3959410329963644

joint_filter:
  alpha: 0.5
